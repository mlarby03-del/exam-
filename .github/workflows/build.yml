                  h+='<div class="lvrow"><div class="lbl">'+LV[l]+' <span class="pill '+p.k+'">'+(p.k==='am'?'صباحا':'مساءا')+'</span></div>'+
                    '<input type="text"'+cls(d.subs[l][0])+' list="sjl" id="s-'+d.id+'-'+l+'-0" data-act="dsub" data-id="'+d.id+'" data-l="'+l+'" data-i="0" value="'+esc(d.subs[l][0])+'" placeholder="المادة 1" aria-label="'+LV[l]+' المادة 1">'+
                    (d.n===2?'<input type="text"'+cls(d.subs[l][1])+' list="sjl" id="s-'+d.id+'-'+l+'-1" data-act="dsub" data-id="'+d.id+'" data-l="'+l+'" data-i="1" value="'+esc(d.subs[l][1])+'" placeholder="المادة 2" aria-label="'+LV[l]+' المادة 2">':'<span></span>')+'</div>';
                });
