              <button type="button" id="lockBtn">اعتماد الجدول</button>
              <label class="seg" style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="autoDist"> توزيع تلقائي (حارس لكل فوج أولا)</label>
