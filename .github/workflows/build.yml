          /* ---------- plan ---------- */
          function gList(p){
            var out=[];p.lv.forEach(function(l){for(var i=1;i<=S.groups[l];i++)out.push({lv:l,n:i,short:l+'/'+i,label:gName(l,i),room:gRoom(l,i)})});return out;
          }
          function pd(di){return PER}
          /* merged day: ONE team for the whole day (size = the larger of the two periods), same teachers supervise the morning groups then the afternoon groups; counted once. */
          function ukOf(di,pk){return isMerged(di)?di+'-am':di+'-'+pk}
          function gN(p){return p.gn!=null?p.gn:gList(p).length}
          function up(di){
            if(!isMerged(di))return PER;
            var all=[],g=0;PER.forEach(function(p){p.lv.forEach(function(l){all.push(l)});g=Math.max(g,gList(p).length)});all.sort();
            return [{k:'am',name:'الفترة الصباحية (مدمجة)',lv:all,gn:g}];
          }
          function isOnly(only,di,pk){return !!only&&only.di===di&&ukOf(di,only.pk)===ukOf(di,pk)}
          function isMerged(di){return !!(S.days[di]&&S.days[di].merge)}
          function lpScore(t,lv){var v=t.lp;if(!v)return 0;var L=Number(v.charAt(1));
            if(v==='a34')return (lv===3||lv===4)?2:0;
            if(v.charAt(0)==='p')return lv===L?-2:0;
            return lv===L?2:0}
          function lpPeriod(t,p){var v=t.lp;if(!v||!p.lv.length)return 0;
            var sc=p.lv.map(function(l){return lpScore(t,l)});
            var mn=Math.min.apply(null,sc),mx=Math.max.apply(null,sc);
            return mn<0?-2.5:(mx>0&&mn>0?2.5:0)}
          function lvPen(t,pk,di){
            var L=t.lv;if(!L||!L.length)return 0;if(isMerged(di))return -1;
            var hasA=false,hasP=false;L.forEach(function(l){if(S.lvPer[l]==='am')hasA=true;else hasP=true});
            var target=(hasA&&hasP)?'pm':(hasA?'am':'pm');
            return pk===target?-1:1;
          }
          function canWork(t,p,di){return t.av===p.k||t.av==='both'||isMerged(di)}
          function blocked(t,di,pk){var d=S.days[di];return !!(d&&(d.reqs||[]).some(function(q){return q.tid===t.id&&q.pk===pk&&q.role==='X'}))}
          function avail(p,di){return S.teachers.filter(function(t){return (t.av===p.k||t.av==='both'||(di!=null&&isMerged(di)))&&(di==null||(!isOff(t,di)&&!blocked(t,di,p.k)))})}
          function exSubj(di,lv,k){var d=S.days[di];return (d&&d.subs[lv]&&d.subs[lv][k-1])||''}
          function rMin(){return Math.min(S.reserve,Math.max(0,S.reserveMin==null?3:S.reserveMin))}
          function renderCaps(){
            var cap=Math.max(1,S.maxPer||6),nd=S.days.length,needTot=0;
            var h='<div class="caps">';
            PER.forEach(function(p){
              var g=gList(p).length;if(!g)return;
              var need=g+rMin(),have=avail(p).length,diff=have-need;
              h+='<div class="cap '+p.k+'"><span class="pill '+p.k+'">'+p.name+'</span>'+
                '<p class="big">'+have+' / '+need+'</p><p class="cnt">أساتذة متاحون / المطلوب في كل فترة</p>'+
                '<p>'+g+' حارس + '+rMin()+' إلى '+S.reserve+' احتياط</p>'+
                (diff>=0?'<span class="pill ok">كافٍ</span>':'<span class="pill bad">ينقص '+(-diff)+' أستاذ</span>')+'</div>';
            });
            var capTot=0;
            S.days.forEach(function(d,di){up(di).forEach(function(p){var g=gN(p);if(g)needTot+=g+rMin()})});
            S.teachers.forEach(function(t){var u=0;S.days.forEach(function(d,di){if(isOff(t,di))return;up(di).forEach(function(p){if(gN(p)&&canWork(t,p,di))u++})});capTot+=Math.min(cap,u)});
            h+='<div class="cap"><span class="pill">مجموع الفترات</span><p class="big">'+capTot+' / '+needTot+'</p><p class="cnt">المتاح (حد أقصى '+cap+' لكل أستاذ) / المطلوب</p>'+
              (capTot>=needTot?'<span class="pill ok">كافٍ</span>':'<span class="pill bad">ينقص '+(needTot-capTot)+' فترة</span>')+'</div>';
            $('capsBox').innerHTML=h+'</div>';
          }
          /* A "period" is one half-day (day + morning/afternoon). Each teacher works at most S.maxPer periods.
             Rules per period:
             - supervisors are NOT teachers of the subjects examined in that period;
             - reserves ARE teachers of the subjects examined that day, split between the subjects;
             - the minimum number of reserves is completed from other subjects only if the subject teachers are not enough (flagged);
             - the team is the same for every session of the period (it rotates between groups); there is ONE reserve list.
             Manual pins are applied first and kept as they are. */
          function allowedFor(short,id){var a=S.gallow&&S.gallow[short];return !a||!a.length||a.indexOf(id)>-1}
          function pinKey(did,k,short){return did+'|'+k+'|'+short}
          function build(only){
            var prevA=S.plan&&S.plan.asg?JSON.parse(JSON.stringify(S.plan.asg)):null;
            var pins=S.pins||{},tReq={},oldTl=(S.plan&&S.plan.tl)||{};
            if(S.plan&&Object.keys(oldTl).length){
              pins=Object.assign({},pins);
              Object.keys(oldTl).forEach(function(tid){
                var a=(S.plan.asg&&S.plan.asg[tid])||{};
                Object.keys(a).forEach(function(key){
                  var p3=key.split('-'),di=Number(p3[0]),pk=p3[1],k=Number(p3[2]),v=a[key],dd0=S.days[di];if(!dd0||!v)return;
                  if(v.charAt(0)==='S'){var pkey=pinKey(dd0.id,k,v.slice(2));if(!pins[pkey])pins[pkey]=tid}
                  else(tReq[di]=tReq[di]||[]).push({tid:tid,role:'R',pk:pk});
                });
              });
            }
            if(S.gallow&&Object.keys(S.gallow).some(function(k){return S.gallow[k]&&S.gallow[k].length})){
              pins=Object.assign({},pins);
              var preD={},capP=Math.max(1,S.maxPer||6);
              S.days.forEach(function(d,di){PER.forEach(function(p){
                var gl0=gList(p);if(!gl0.length)return;
