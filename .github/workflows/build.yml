                  for(var k=1;k<=2;k++){
                    if(k<=d.n)h+='<input type="text" id="tm-'+d.id+'-'+p.k+'-'+k+'" data-act="dtime" data-id="'+d.id+'" data-p="'+p.k+'" data-k="'+k+'" value="'+esc((d.t&&d.t[p.k]&&d.t[p.k][k-1])||'')+'" placeholder="الحصة '+k+': 08:00 - 09:30" aria-label="توقيت الحصة '+k+'">';
                    else h+='<span></span>';
                  }
                  h+='</div>';
                });
                h+='<div style="margin:12px 0 6px;font-weight:700">طلبات الأساتذة (مقفلة)</div>';
                (d.reqs||[]).forEach(function(q,qi){
                  var tq=T(q.tid);if(!tq)return;
                  h+='<div class="row" style="margin-bottom:6px"><span class="grow">🔒 '+esc(tq.name)+' — '+(q.pk==='am'?'صباحا':'مساءا')+' — '+(q.role==='S'?'حراسة':q.role==='X'?'ممنوع من الحراسة':'احتياط')+'</span><button type="button" class="ib2" data-act="delreq" data-id="'+d.id+'" data-i="'+qi+'" aria-label="حذف الطلب">✕</button></div>';
                });
                h+='<div class="row" style="flex-wrap:wrap;gap:6px"><select id="rq-t-'+d.id+'" aria-label="الأستاذ"><option value="">الأستاذ…</option>'+S.teachers.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+'</option>'}).join('')+'</select>'+
                  '<select id="rq-p-'+d.id+'" aria-label="الفترة"><option value="am">صباحا</option><option value="pm">مساءا</option></select>'+
                  '<select id="rq-r-'+d.id+'" aria-label="المهمة"><option value="S">حراسة</option><option value="R">احتياط</option><option value="X">ممنوع من الحراسة</option></select>'+
                  '<button type="button" data-act="addreq" data-id="'+d.id+'">قفل الطلب</button></div>';
                h+='<p class="hint">الطلب المقفل يبقى كما هو عند إنجاز الجدول، ولو خالف شرط المادة أو الفترة. لتثبيت أستاذ في فوج معيّن استعمل التثبيت في تبويب الجدول.</p>';
                h+='<p class="hint">الخانة الحمراء: المادة غير مرتبطة بمادة أساتذة، فلا يطبَّق عليها شرط الاحتياط.</p>';
                h+='<div class="row" style="margin-top:8px"><button type="button" data-act="toggleday" data-id="'+d.id+'">إغلاق</button></div></div>';
