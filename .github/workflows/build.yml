            list.forEach(function(t){
              h+='<div class="pg tp"><div class="ph"><p>الجمهورية الجزائرية الديمقراطية الشعبية</p><p>وزارة التربية الوطنية</p></div>'+
                '<div class="ph2"><span>المؤسسة: '+esc(S.school||'')+'</span><span>السنة الدراسية: '+esc(S.year||'')+'</span></div>'+
