              var r=importStudents(sheets,defG);
              msg.textContent=r.n?('تم استيراد '+r.n+' تلميذا في '+r.groups+' فوج'+(r.skipped?' (تخطّي '+r.skipped+' سطرا بدون فوج أو اسم)':'')+'.'):'لم يُستورد أي تلميذ: تأكد من وجود عمود «الاسم» وعمود «الفوج»، أو اختر فوجا افتراضيا.';
              renderStSum();renderAbs();
