                  '<td><input type="text" id="gr-'+l+'-'+i+'" data-act="groom" data-l="'+l+'" data-n="'+i+'" value="'+esc((S.rooms||{})[l+'/'+i]||'')+'" placeholder="قاعة" aria-label="قاعة الفوج"></td></tr>';
              }
              h+='</tbody></table></div></details>';
