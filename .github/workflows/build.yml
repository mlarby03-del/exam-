              <div class="row" style="margin-top:8px"><button type="button" class="pri" id="rmCopy">نسخ</button><button type="button" id="rmWa">فتح واتساب</button><button type="button" id="rmWaT">إرسال لهذا الأستاذ</button><span class="cnt" id="rmMsg" aria-live="polite"></span></div>
            </div>
            <div id="logBox"></div>
            <div class="card">
              <h2>الطباعة</h2>
              <div class="row">
                <div class="grow"><label class="f" for="pDay">اليوم</label><select id="pDay"></select></div>
                <div class="grow"><label class="f" for="pPer">الفترة</label><select id="pPer"><option value="all">الفترتان</option><option value="am">صباحا</option><option value="pm">مساءا</option></select></div>
              </div>
              <div class="row" style="margin-top:10px"><div class="grow"><label class="f" for="pTch">الأستاذ</label><select id="pTch"></select></div></div>
              <label class="seg" style="margin-top:10px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="twoUp"> جدولا أستاذين في ورقة واحدة (عند طباعة أوراق الأساتذة)</label>
              <label class="seg" style="margin-top:10px;display:flex;gap:8px;align-items:center"><input type="checkbox" id="showGrp"> إظهار القسم والقاعة والمادة في ورقة الأستاذ (غير مفعّل: تُكتب «حراسة» فقط)</label>
              <div class="row" style="margin-top:10px"><button class="pri" type="button" id="printG">طباعة جدول الحراسة</button><button class="pri" type="button" id="printP">طباعة جدول الأستاذ</button><button type="button" id="printT">الجدول الإجمالي للأساتذة</button></div>
              <div class="row" style="margin-top:10px"><button type="button" id="printD">ورقة اليوم (صفحة واحدة)</button><button type="button" id="printPA">أوراق كل الأساتذة</button><button type="button" id="csvBtn">تصدير Excel (CSV)</button><button type="button" id="printR">ورقة الاحتياط</button></div>
              <div class="row" style="margin-top:10px"><button type="button" class="pri" id="printM">الجدول الشامل (ورقة واحدة)</button><button type="button" class="pri" id="xlsxBtn">الجدول الشامل Excel</button></div>
              <p class="hint">لحفظ PDF: اضغط طباعة ثم اختر «حفظ بصيغة PDF» في نافذة الطباعة.</p>
              <div class="row" style="margin-top:10px"><div class="grow"><label class="f" for="rgFrom">أوراق الأساتذة: من رقم</label><input type="number" id="rgFrom" min="1" inputmode="numeric" placeholder="1"></div><div class="grow"><label class="f" for="rgTo">إلى رقم</label><input type="number" id="rgTo" min="1" inputmode="numeric" placeholder="الكل"></div></div>
              <p class="hint">الأرقام حسب ترتيب الأساتذة في القائمة (مرتبين بالمادة). اتركهما فارغين لطباعة الكل.</p>
            </div>
            <div class="card"><h2>النسخ التلقائية</h2><p class="hint" style="margin:0 0 8px">تُحفظ نسخة داخل التطبيق كلما ضغطت «إنجاز الجدول» (آخر 5 نسخ). لا تعوّض أيقونة الحفظ (مجلد Documents/exam) عند حذف التطبيق.</p><div class="row"><div class="grow"><select id="autoSel" aria-label="النسخ التلقائية"></select></div><button type="button" id="autoRes">استرجاع</button></div></div>
            <div id="planBox"></div>
          </section>
          </div>
          <section class="panel" id="abs">
            <div class="card"><h2>غيابات التلاميذ</h2>
              <p class="hint" style="margin:0 0 8px">سجّل أسماء التلاميذ الغائبين في كل فوج وحصة (افصل الأسماء بفاصلة). يُحفظ تلقائيا.</p>
              <div class="row"><select id="stDay" aria-label="اليوم"></select><select id="stP" aria-label="الفترة"></select></div>
              <div class="row" style="margin-top:10px"><button type="button" class="pri" id="stPrint">طباعة غيابات اليوم</button><button type="button" id="stPrintAll">طباعة كل الأيام</button></div>
            </div>
            <div class="card"><h2>قائمة التلاميذ (Excel)</h2>
              <p class="hint" style="margin:0 0 8px">استورد ملف xlsx أو csv: عمود «الاسم» (أو «اللقب» و«الاسم») وعمود «الفوج» (مثل 2/1 أو اسم الفوج). يمكن أيضا أن يكون اسم الورقة هو اسم الفوج. بعد الاستيراد تعلّم الغائبين بخانة اختيار.</p>
              <div class="row"><input type="file" id="stFile" accept=".xlsx,.csv,.txt,text/csv"><select id="stGrpDef" aria-label="فوج افتراضي"></select></div>
              <div class="row" style="margin-top:8px"><button type="button" data-act="stclear">حذف قائمة التلاميذ</button></div>
              <p class="hint" id="stSum"></p><p class="hint" id="stMsg" aria-live="polite"></p>
            </div>
            <div id="stBody"></div>
          </section>
          <section class="panel" id="emg">
            <div class="card"><h2>طوارئ يوم الاختبار</h2>
              <p class="hint" style="margin:0 0 8px">اختر اليوم، ثم اضغط اسم الأستاذ الغائب، ثم اضغط مرة ثانية للتأكيد. يعوّضه أستاذ من الاحتياط تلقائيا.</p>
              <div class="row"><select id="emDay" aria-label="اليوم"></select><input type="text" id="emQ" placeholder="بحث عن أستاذ" aria-label="بحث"></div>
            </div>
            <div id="emBody"></div>
          </section>
          <div id="printSheet" dir="rtl" lang="ar"></div>
          <style id="pgs"></style>

          <script>
          (function(){
          var KEY='hirasa-v3';
          var LV={1:'السنة الأولى',2:'السنة الثانية',3:'السنة الثالثة',4:'السنة الرابعة'};
          var PER=[{k:'am',name:'الفترة الصباحية',lv:[]},{k:'pm',name:'الفترة المسائية',lv:[]}];
          function syncPer(){PER.forEach(function(p){p.lv=[1,2,3,4].filter(function(l){return S.lvPer[l]===p.k})})}
          var AVL={am:'صباحا',pm:'مساءا',both:'اليوم كاملا'};
          var SUBJ=['اللغة العربية','الرياضيات','اللغة الفرنسية','اللغة الإنجليزية','العلوم الطبيعية','العلوم الفيزيائية','التاريخ و الجغرافيا و التربية المدنية','التربية الإسلامية','التربية التشكيلية','التربية الموسيقية','التربية البدنية','الإعلام الآلي'];
          var EXTRA=['التاريخ و الجغرافيا','التربية المدنية','الأمازيغية'];
          var EXN=[4,4,3,3,3,2,3,2,1,1,3,1], EXA=['both','am','pm','both'];
          var uid=function(){return Math.random().toString(36).slice(2,9)};
          var S, openAdd=null, openDay=null, openOff=null, pending=null, absMsg={};

          function newDay(){return {id:uid(),date:'',n:2,same:true,merge:false,cs:['',''],subs:{1:['',''],2:['',''],3:['',''],4:['','']},t:{am:['',''],pm:['','']},reqs:[]}}
          function fixState(o){
            o.pins=o.pins||{};o.maxPer=o.maxPer||6;if(o.reserveMin==null)o.reserveMin=3;
            o.lvPer=o.lvPer||{1:'pm',2:'am',3:'pm',4:'am'};o.gallow=o.gallow||{};o.students=o.students||[];o.gnames=o.gnames||{};o.rooms=o.rooms||{};
            if(!o.terms||!o.terms.length){o.terms=[{id:'t1',name:'الفصل الأول'}];o.curTerm='t1'}
            o.termData=o.termData||{};
            var fx=function(d){d.t=d.t||{am:['',''],pm:['','']};d.reqs=d.reqs||[];
              if(d.merge==null)d.merge=false;
              if(d.same==null){var sb=d.subs||{},k=[1,2,3,4].map(function(l){return JSON.stringify(sb[l]||['',''])});d.same=k.every(function(x){return x===k[0]});var f=[1,2,3,4].map(function(l){return sb[l]||['','']}).filter(function(a){return a[0]||a[1]})[0];d.cs=(f||['','']).slice()}
              if(!d.cs)d.cs=['',''];};
            o.defT=o.defT||{am:['',''],pm:['','']};
            o.days.forEach(fx);o.stAbs=o.stAbs||{};if(o.mbv3!==1){o.mustBoth=true;o.mbv3=1}if(o.mustBoth==null)o.mustBoth=true;if(o.autoDist==null)o.autoDist=true;o.lock=o.lock||{};o.logs=o.logs||{};if(o.showGrp==null)o.showGrp=false;if(o.twoUp==null)o.twoUp=false;
            Object.keys(o.termData).forEach(function(k){(o.termData[k].days||[]).forEach(fx)});
            return o;
          }
          function seed(){
            var subjects=SUBJ.map(function(n){return {id:uid(),name:n}});
            var teachers=[],k=0;
            subjects.forEach(function(s,i){for(var j=1;j<=EXN[i];j++){teachers.push({id:uid(),name:'مثال: أستاذ '+s.name+' '+j,sid:s.id,av:EXA[k++%4],ex:true})}});
            var days=[];for(var i=0;i<5;i++)days.push(newDay());
            return fixState({subjects:subjects,teachers:teachers,groups:{1:10,2:7,3:6,4:6},reserve:4,days:days,pins:{},lvPer:{1:'pm',2:'am',3:'pm',4:'am'},maxPer:6,reserveMin:3,plan:null,school:'متوسطة المجاهد الطاهر ايت علجت',year:'2026 / 2027'});
          }
          function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.subjects&&o.days)return fixState(o)}}catch(e){}return seed()}
          function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
          S=load();syncPer();

          function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
          function $(id){return document.getElementById(id)}
          function subjName(id){var s=S.subjects.find(function(x){return x.id===id});return s?s.name:'—'}
          function T(id){return S.teachers.find(function(x){return x.id===id})}
          function dirty(){S.plan=null;save()}
          function dayTitle(i){var d=S.days[i];return 'اليوم '+(i+1)+(d.date?' - '+d.date:'')}
          function gName(l,n){return (S.gnames&&S.gnames[l+'/'+n])||(LV[l]+' - فوج '+n)}
          function gRoom(l,n){return (S.rooms&&S.rooms[l+'/'+n])||''}
          function norm(t){return String(t||'').replace(/\s+/g,' ').trim()}
          function resolveSubj(text){
            text=norm(text);if(text.length<2)return null;
            var ex=S.subjects.find(function(x){return norm(x.name)===text});if(ex)return ex.id;
            var c=S.subjects.find(function(x){var n=norm(x.name);return n.indexOf(text)>-1||(n.length>=4&&text.indexOf(n)>-1)});
            return c?c.id:null;
          }
          function examIds(di,p){
            var d=S.days[di],out=[];
            p.lv.forEach(function(l){for(var k=1;k<=d.n;k++){var id=resolveSubj(exSubj(di,l,k));if(id&&out.indexOf(id)<0)out.push(id)}});
            return out;
          }
          function isOff(t,di){var d=S.days[di];return !!(d&&t.off&&t.off.indexOf(d.id)>-1)}
          function timeOf(di,pk,k){
            var d=S.days[di],o=pk==='am'?'pm':'am',g=S.defT||{};
            return (d&&d.t&&d.t[pk]&&d.t[pk][k-1])||(g[pk]&&g[pk][k-1])||(g[o]&&g[o][k-1])||(d&&d.t&&d.t[o]&&d.t[o][k-1])||'';
          }
          function termName(){var c=S.terms.find(function(t){return t.id===S.curTerm});return c?c.name:''}

          /* ---------- tabs ---------- */
          function showTab(){
            var h=(location.hash||'#teachers').slice(1);if(!/^(teachers|groups|days|plan|abs|emg)$/.test(h))h='teachers';
            document.querySelectorAll('section.panel').forEach(function(p){p.classList.toggle('on',p.id===h)});
            document.querySelectorAll('nav a').forEach(function(a){a.classList.toggle('on',a.dataset.tab===h)});
            if(h==='plan')renderCaps();
            if(h==='abs')renderAbs();
            if(h==='emg')renderEmg();
          }
          window.addEventListener('hashchange',showTab);

          /* ---------- teachers ---------- */
          function renderEx(){
            var n=S.teachers.filter(function(t){return t.ex}).length;
            $('exNote').innerHTML=n?'<div class="note"><span>الأسماء التي تبدأ بكلمة «مثال» هي أمثلة للتجربة ('+n+').</span><button type="button" data-act="clearex">مسح الأمثلة</button></div>':'';
          }
          var PLUS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
          var CAL='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>';
          function waNum(p){var d=String(p||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);else if(d.charAt(0)==='0')d='213'+d.slice(1);return d}
          function contactLinks(t){
            if(!t||!t.phone)return '';
            return '<a href="tel:'+esc(String(t.phone).replace(/[^\d+]/g,''))+'" aria-label="اتصال بـ '+esc(t.name)+'">📞</a><a href="https://wa.me/'+waNum(t.phone)+'" aria-label="واتساب '+esc(t.name)+'">💬</a>';
          }
          function renderTeach(){
            var h='';
            S.subjects.forEach(function(s){
              var ts=S.teachers.filter(function(t){return t.sid===s.id});
              var op=openAdd===s.id;
              h+='<div class="card"><div class="sbhead"><span class="row"><button class="icon" type="button" data-act="toggleadd" data-id="'+s.id+'" aria-expanded="'+op+'" aria-label="إضافة أساتذة لمادة '+esc(s.name)+'">'+PLUS+'</button><b>'+esc(s.name)+'</b><span class="cnt">'+ts.length+' أستاذ</span></span>'+
                '<button class="del" type="button" data-act="delsubj" data-id="'+s.id+'"'+(ts.length?' disabled title="امسح أساتذة المادة أولا"':'')+'>حذف المادة</button></div>';
              if(op){
                h+='<div class="addbox"><label class="f" for="nm-'+s.id+'">أسماء أساتذة '+esc(s.name)+' (اسم في كل سطر)</label>'+
                  '<textarea id="nm-'+s.id+'" placeholder="مثال:&#10;بن عمر محمد&#10;سعيدي فاطمة"></textarea>'+
                  '<div class="seg" style="margin:8px 0">'+
                  ['am','pm','both'].map(function(v){return '<label><input type="radio" name="av-'+s.id+'" value="'+v+'"'+(v==='both'?' checked':'')+'> '+(v==='am'?'فترة صباحية':v==='pm'?'فترة مسائية':'اليوم كاملا')+'</label>'}).join('')+
                  '</div><div class="row"><button class="pri" type="button" data-act="doadd" data-id="'+s.id+'">إضافة</button><button type="button" data-act="toggleadd" data-id="'+s.id+'">إغلاق</button></div></div>';
              }
              if(!ts.length)h+='<div class="empty">لا يوجد أساتذة لهذه المادة.</div>';
              ts.forEach(function(t){
                var no=(t.off||[]).length;
                h+='<div class="trow"><input type="text" id="n-'+t.id+'" data-act="rename" data-id="'+t.id+'" value="'+esc(t.name)+'" aria-label="اسم الأستاذ">'+
                  '<select id="a-'+t.id+'" data-act="setav" data-id="'+t.id+'" aria-label="الحراسة">'+
                  ['am','pm','both'].map(function(v){return '<option value="'+v+'"'+(t.av===v?' selected':'')+'>'+AVL[v]+'</option>'}).join('')+'</select>'+
                  '<button class="ib2" type="button" data-act="toggleoff" data-id="'+t.id+'" aria-expanded="'+(openOff===t.id)+'" aria-label="أيام غياب '+esc(t.name)+'">'+(no?'غياب/هاتف ('+no+')':'غياب/هاتف')+'</button>'+
                  '<button class="del" type="button" data-act="delt" data-id="'+t.id+'" aria-label="حذف">حذف</button></div>';
                if(openOff===t.id){
                  h+='<div class="addbox" style="margin-bottom:8px"><div class="row" style="margin-bottom:10px"><div class="grow"><label class="f" for="ph-'+t.id+'">رقم الهاتف (اختياري)</label><input type="tel" inputmode="tel" id="ph-'+t.id+'" data-act="phone" data-id="'+t.id+'" value="'+esc(t.phone||'')+'" placeholder="0555 00 00 00"></div><span class="chips">'+contactLinks(t)+'</span></div>';
