            if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){m.textContent='تم النسخ'},fb)}else fb();
          });

          $('school').value=S.school||'';$('year').value=S.year||'';
          uiApply();renderAll();showTab();
          window.__hirasa_test=window.__hirasa_test||null;
          })();
