          function matchGroup(txt){
            var s=norm(digits(txt));if(!s)return '';
            var gs=allGroups(),i;
            for(i=0;i<gs.length;i++)if(s===gs[i].short||s===norm(digits(gs[i].label)))return gs[i].short;
            var m=/(\d)\D+(\d+)/.exec(s)||/^(\d)(\d{1,2})$/.exec(s);
