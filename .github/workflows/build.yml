              <label class="seg" style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="ownSup"> يمكن لأساتذة مواد اليوم أن يكونوا حراسا أيضا (ليس احتياطا فقط)، حتى في فوج مادتهم</label>
              <p class="hint" style="margin:0 0 10px">اضغط على أيقونة التقويم في كل يوم لتحديد عدد المواد و مادة كل مستوى. كل فوج يجتاز مواد اليوم في فترته (صباحا أو مساءا).</p>
