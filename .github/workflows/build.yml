          function remindOne(t){
            var P=S.plan,L=[];
            S.days.forEach(function(d,di){
              pd(di).forEach(function(p){
                if(!gList(p).length)return;
                var pp0=P.days[di].slots[0].periods.find(function(q){return q.k===p.k});if(!pp0)return;
                var isRes=pp0.reserves.indexOf(t.id)>-1,mine=[];
                for(var k=1;k<=d.n;k++){
                  var pk=P.days[di].slots[k-1].periods.find(function(q){return q.k===p.k}),g=pk&&pk.groups.find(function(q){return q.tid===t.id});
                  if(g){var lb=g.label+((S.rooms&&S.rooms[g.short])?' ('+S.rooms[g.short]+')':'');if(mine.indexOf(lb)<0)mine.push(lb)}
                }
                if(!isRes&&!mine.length)return;
                var tms=[];for(var k2=1;k2<=d.n;k2++){var tm=timeOf(di,p.k,k2);if(tm)tms.push(tm)}
                L.push('- '+dayTitle(di)+' '+(p.k==='am'?'صباحا':'مساءا')+(tms.length?' ('+tms.join(' / ')+')':'')+': '+(mine.length?'حراسة '+mine.join(' + '):'احتياط'));
              });
            });
            return L.length?'الأستاذ(ة) '+t.name+':\n'+L.join('\n'):'';
          }
