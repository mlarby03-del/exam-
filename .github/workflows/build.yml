          $('autoRes').addEventListener('click',function(){var l=autoList(),x=l[Number($('autoSel').value)];if(!x)return;pending=x.d;$('bkMsg').innerHTML='<div class="note"><span>استرجاع هذه النسخة؟ سيتم استبدال كل المعلومات الحالية.</span><span class="row"><button class="pri" type="button" data-act="impok">استرجاع</button><button type="button" data-act="impno">إلغاء</button></span></div>';window.scrollTo(0,0)});
          $('printT').addEventListener('click',function(){doPrint('t')});
