            else if(a==='stchk'){var kk2=t.dataset.key,nn=t.dataset.n,ls=String(S.stAbs[kk2]||'').split(/[،,;؛\n]+/).map(norm).filter(Boolean),i2=ls.indexOf(nn);if(t.checked&&i2<0)ls.push(nn);if(!t.checked&&i2>-1)ls.splice(i2,1);if(ls.length)S.stAbs[kk2]=ls.join('، ');else delete S.stAbs[kk2];openSt[kk2]=true;save();renderAbs()}
