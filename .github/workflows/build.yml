              <div class="row"><select id="absDaySel" aria-label="اليوم"></select><input type="text" id="absQ" placeholder="بحث عن أستاذ" aria-label="بحث عن أستاذ"></div>
              <div id="absChips" class="chips" style="margin-top:8px"></div><div id="absRes" style="margin-top:6px"></div>
            </div>
            <div class="card"><h2>رسائل التذكير</h2>
              <p class="hint" style="margin:0 0 8px">رسالة جاهزة بيوم الأستاذ وفترته وقاعته. اختر «كل الأساتذة» لرسالة واحدة تنسخها وتبعثها في مجموعة واتساب.</p>
              <select id="rmTch" aria-label="الأستاذ"></select>
