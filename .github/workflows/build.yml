            var ds=new DecompressionStream('deflate-raw'),st=new Blob([f.d]).stream().pipeThrough(ds);
            return new Response(st).arrayBuffer().then(function(ab){return new TextDecoder('utf-8').decode(ab)});
          }
          function colIdx(r){var m=/^([A-Z]+)/.exec(r||'');if(!m)return 0;var n=0;for(var i=0;i<m[1].length;i++)n=n*26+m[1].charCodeAt(i)-64;return n-1}
