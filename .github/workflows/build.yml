          function importStudents(sheets,defG){
            var add=[],groupsSeen={},skipped=0;
            sheets.forEach(function(sh){
              var rows=sh.rows.filter(function(r){return r&&r.some(function(c){return c})});if(!rows.length)return;
              var hi=-1,ni=[],gi=-1;
              for(var i=0;i<Math.min(rows.length,6)&&hi<0;i++){
                var r=rows[i];
                r.forEach(function(c,ci){var x=norm(c);if(/^(اللقب|لقب)$/.test(x))ni.unshift(ci);else if(/^(الاسم|اسم|الإسم|الاسم الكامل|اسم التلميذ|الاسم واللقب|اللقب والاسم|name)$/i.test(x))ni.push(ci);else if(/(الفوج|القسم|group|class)/i.test(x))gi=ci});
                if(ni.length)hi=i;
              }
              var start=hi>=0?hi+1:0;if(hi<0){ni=[0];gi=rows.some(function(r){return r.length>1&&matchGroup(r[1])})?1:-1}
              var shG=matchGroup(sh.name);
              for(var j=start;j<rows.length;j++){
                var rw=rows[j],nm0=ni.map(function(c){return rw[c]||''}).filter(Boolean).join(' ');nm0=norm(nm0);
                if(!nm0||/^\d+$/.test(nm0)){skipped++;continue}
                var g=(gi>=0&&matchGroup(rw[gi]))||shG||defG||'';
