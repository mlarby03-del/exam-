          function sheetGroups(dsel,psel){
            var P=S.plan,h='';
            P.days.forEach(function(day,di){
              if(dsel>=0&&di!==dsel)return;
              var d=S.days[di];
              PER.forEach(function(p){
                if(psel!=='all'&&p.k!==psel)return;
                var gl=gList(p);if(!gl.length)return;
                var hasRoom=gl.some(function(g){return g.room});
                h+='<div class="pg">'+sheetHead('جدول الحراسة - '+esc(termName())+' - '+esc(dayTitle(di))+' - '+p.name);
                h+='<table class="tt"><thead><tr><th>الفوج</th>'+(hasRoom?'<th>القاعة</th>':'');
                for(var k=1;k<=d.n;k++){var tm=timeOf(di,p.k,k);h+='<th>المادة'+(d.n>1?' '+k:'')+(tm?'<br><small>'+esc(tm)+'</small>':'')+'</th><th>الأستاذ الحارس'+(d.n>1?' '+k:'')+'</th>'}
                h+='</tr></thead><tbody>';
                p.lv.forEach(function(l){
                  for(var n=1;n<=S.groups[l];n++){
                    h+='<tr><td>'+esc(gName(l,n))+'</td>'+(hasRoom?'<td>'+esc(gRoom(l,n))+'</td>':'');
                    for(var k2=1;k2<=d.n;k2++){
                      var pp=day.slots[k2-1].periods.find(function(q){return q.k===p.k});
                      var g=pp.groups.find(function(q){return q.short===l+'/'+n});
                      h+='<td>'+esc(exSubj(di,l,k2)||'—')+'</td><td class="l">'+(g&&g.tid?esc(nm(g.tid)):'—')+'</td>';
                    }
                    h+='</tr>';
                  }
                });
                h+='</tbody></table>';
                var r1=day.slots[0].periods.find(function(q){return q.k===p.k});
                h+='<p class="res"><b>الأساتذة الاحتياط:</b></p><ol class="rl">'+r1.reserves.map(function(id){return '<li>'+esc(nm(id))+'</li>'}).join('')+'</ol>';
                h+='<div class="sig">مدير المتوسطة</div></div>';
              });
            });
            return h;
          }
          function doPrint(kind){
            if(!S.plan)build();
            var land=(kind==='t'),dv=$('pDay').value,html;
            if(kind==='t')html=sheetTeachers();
            else if(kind==='p')html=sheetPersonal($('pTch').value);
            else html=sheetGroups(dv==='all'?-1:Number(dv),$('pPer').value);
            $('printSheet').innerHTML=html;
            $('pgs').textContent='@media print{@page{size:A4 '+(land?'landscape':'portrait')+';margin:12mm}}';
            setTimeout(function(){
              if(window.AndroidPrint&&window.AndroidPrint.print){window.AndroidPrint.print(land)}
              else{try{window.print()}catch(e){}}
            },80);
          }

          /* ---------- events ---------- */
          document.addEventListener('click',function(e){
            var b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
            var a=b.dataset.act,id=b.dataset.id;
            if(a==='delt'){S.teachers=S.teachers.filter(function(t){return t.id!==id});Object.keys(S.pins).forEach(function(k){if(S.pins[k]===id)delete S.pins[k]});S.days.forEach(function(d){d.reqs=(d.reqs||[]).filter(function(q){return q.tid!==id})});dirty();renderTeach();renderEx();renderPlan()}
            else if(a==='delsubj'){S.subjects=S.subjects.filter(function(s){return s.id!==id});dirty();renderTeach()}
            else if(a==='clearex'){S.teachers=S.teachers.filter(function(t){return !t.ex});Object.keys(S.pins).forEach(function(k){if(!T(S.pins[k]))delete S.pins[k]});dirty();renderTeach();renderEx();renderPlan()}
            else if(a==='toggleadd'){openAdd=(openAdd===id)?null:id;renderTeach();if(openAdd){var ta=$('nm-'+id);if(ta)ta.focus()}}
            else if(a==='impok'){applyImport()}
            else if(a==='impno'){pending=null;$('bkMsg').innerHTML=''}
            else if(a==='toggleday'){openDay=(openDay===id)?null:id;renderDays()}
            else if(a==='addreq'){var rd=S.days.find(function(q){return q.id===id}),rt=$('rq-t-'+id);if(rd&&rt&&rt.value){rd.reqs=rd.reqs||[];var rp=$('rq-p-'+id).value,rr=$('rq-r-'+id).value;if(!rd.reqs.some(function(q){return q.tid===rt.value&&q.pk===rp}))rd.reqs.push({tid:rt.value,pk:rp,role:rr});dirty();renderDays();renderPlan()}}
            else if(a==='delreq'){var rd2=S.days.find(function(q){return q.id===id});if(rd2){rd2.reqs.splice(Number(b.dataset.i),1);dirty();renderDays();renderPlan()}}
            else if(a==='toggleoff'){openOff=(openOff===id)?null:id;renderTeach()}
            else if(a==='absent'){var adi=Number(b.dataset.di),asel=$('ab-'+adi);if(asel&&asel.value)replaceAbsent(adi,asel.value)}
            else if(a==='doadd'){
              var ta2=$('nm-'+id),names=ta2.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
              if(!names.length){ta2.focus();return}
              var r=document.querySelector('input[name="av-'+id+'"]:checked'),av=r?r.value:'both';
              names.forEach(function(n){S.teachers.push({id:uid(),name:n,sid:id,av:av})});
              openAdd=null;dirty();renderTeach();renderPlan();
            }
            else if(a==='ginc'){var l=b.dataset.l;S.groups[l]=Math.max(0,S.groups[l]+Number(b.dataset.d));dirty();renderGroups();renderPlan()}
            else if(a==='minc'||a==='mdec'){S.maxPer=Math.max(1,S.maxPer+(a==='minc'?1:-1));dirty();renderGroups();renderCaps();renderPlan()}
            else if(a==='mrinc'||a==='mrdec'){S.reserveMin=Math.max(0,rMin()+(a==='mrinc'?1:-1));if(S.reserveMin>S.reserve)S.reserve=S.reserveMin;dirty();renderGroups();renderCaps();renderPlan()}
            else if(a==='rinc'||a==='rdec'){S.reserve=Math.max(0,S.reserve+(a==='rinc'?1:-1));if(S.reserveMin>S.reserve)S.reserveMin=S.reserve;dirty();renderGroups();renderPlan()}
          });
          document.addEventListener('change',function(e){
            var t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
            function day(){return S.days.find(function(q){return q.id===t.dataset.id})}
            if(a==='pin'){S.pins=S.pins||{};var pk=pinKey(t.dataset.d,t.dataset.k,t.dataset.s);if(t.value)S.pins[pk]=t.value;else delete S.pins[pk];S.plan=null;save();$('copyBtn').disabled=true;$('copyMsg').textContent='اضغط إنجاز الجدول'}
            else if(a==='rename'){var x=T(t.dataset.id);if(x&&t.value.trim()){x.name=t.value.trim();x.ex=false;dirty();renderEx();renderPlan()}}
            else if(a==='setav'){var y=T(t.dataset.id);if(y){y.av=t.value;dirty();renderPlan()}}
            else if(a==='lper'){S.lvPer[t.dataset.l]=t.value;syncPer();dirty();renderGroups();renderDays();renderCaps();renderPlan()}
            else if(a==='gset'){S.groups[t.dataset.l]=Math.max(0,parseInt(t.value,10)||0);dirty();renderGroups();renderPlan()}
            else if(a==='ddate'){var d1=day();if(d1){d1.date=t.value.trim();dirty();renderPlan()}}
            else if(a==='dn'){var d2=day();if(d2){d2.n=Number(t.value);dirty();renderDays();renderPlan()}}
            else if(a==='dsub'){var d3=day();if(d3){d3.subs[t.dataset.l][Number(t.dataset.i)]=t.value.trim();dirty();renderDays();renderPlan()}}
            else if(a==='dtime'){var d4=day();if(d4){d4.t=d4.t||{am:['',''],pm:['','']};d4.t[t.dataset.p][Number(t.dataset.k)-1]=t.value.trim();save();renderPlan()}}
            else if(a==='offday'){var tf=T(t.dataset.id);if(tf){tf.off=tf.off||[];var ix=tf.off.indexOf(t.dataset.d);if(t.checked&&ix<0)tf.off.push(t.dataset.d);if(!t.checked&&ix>-1)tf.off.splice(ix,1);dirty();renderTeach();renderCaps();renderPlan()}}
            else if(a==='gname'||a==='groom'){var store=(a==='gname')?(S.gnames=S.gnames||{}):(S.rooms=S.rooms||{}),gk=t.dataset.l+'/'+t.dataset.n;if(t.value.trim())store[gk]=t.value.trim();else delete store[gk];dirty();renderPlan()}
          });

          /* ---------- backup / restore ---------- */
          function bkMsg(t,ok){$('bkMsg').innerHTML=t?'<div class="'+(ok===false?'note':'okmsg')+'">'+t+'</div>':''}
          function exportData(){
            var name='hirasa-'+new Date().toISOString().slice(0,10)+'.json';
            var json=JSON.stringify({app:'hirasa',v:3,data:S});
            try{
              if(window.AndroidBackup&&window.AndroidBackup.saveFile){
                var r=window.AndroidBackup.saveFile(name,json);
                bkMsg(r==='downloads'?'تم الحفظ في مجلد التنزيلات (Downloads): '+esc(name):'تم الحفظ: '+esc(String(r)));
              }else{
                var b=new Blob([json],{type:'application/json'}),a=document.createElement('a');
                a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();
                bkMsg('تم تنزيل الملف: '+esc(name));
              }
            }catch(e){bkMsg('تعذر الحفظ',false)}
          }
          function readImport(f){
            var fr=new FileReader();
            fr.onload=function(){
              try{
                var o=JSON.parse(fr.result);
                if(!o||o.app!=='hirasa'||!o.data||!o.data.subjects||!o.data.teachers||!o.data.days)throw new Error('bad');
                pending=o.data;
                $('bkMsg').innerHTML='<div class="note"><span>استيراد «'+esc(f.name)+'»؟ سيتم استبدال كل المعلومات الحالية.</span><span class="row"><button class="pri" type="button" data-act="impok">استيراد</button><button type="button" data-act="impno">إلغاء</button></span></div>';
              }catch(e){pending=null;bkMsg('هذا الملف ليس نسخة احتياطية من التطبيق.',false)}
            };
            fr.onerror=function(){bkMsg('تعذرت قراءة الملف.',false)};
            fr.readAsText(f,'utf-8');
          }
          function applyImport(){
            if(!pending)return;
            S=fixState(pending);pending=null;syncPer();S.plan=null;openAdd=null;openDay=null;save();
            $('school').value=S.school||'';$('year').value=S.year||'';
            renderAll();
            bkMsg('تم استيراد المعلومات.');
          }
          $('expBtn').addEventListener('click',exportData);
          $('impBtn').addEventListener('click',function(){$('impFile').click()});
          $('impFile').addEventListener('change',function(){var f=this.files&&this.files[0];if(f)readImport(f);this.value=''});
          $('maxN').addEventListener('change',function(){S.maxPer=Math.max(1,parseInt(this.value,10)||6);dirty();renderGroups();renderCaps();renderPlan()});
          $('minResN').addEventListener('change',function(){S.reserveMin=Math.max(0,parseInt(this.value,10)||0);if(S.reserveMin>S.reserve)S.reserve=S.reserveMin;dirty();renderGroups();renderCaps();renderPlan()});
          $('resN').addEventListener('change',function(){S.reserve=Math.max(0,parseInt(this.value,10)||0);if(S.reserveMin>S.reserve)S.reserveMin=S.reserve;dirty();renderGroups();renderPlan()});
          $('school').addEventListener('change',function(){S.school=this.value.trim();save()});
          $('year').addEventListener('change',function(){S.year=this.value.trim();save()});
          $('addSubjBtn').addEventListener('click',function(){
            var n=$('newSubj').value.trim();if(!n)return;
            S.subjects.push({id:uid(),name:n});$('newSubj').value='';save();renderTeach();
          });
          $('addDay').addEventListener('click',function(){var d=newDay();S.days.push(d);openDay=d.id;dirty();renderDays();renderPlan()});
          $('delDay').addEventListener('click',function(){if(S.days.length>1){S.days.pop();openDay=null;dirty();renderDays();renderPlan()}});
          $('buildBtn').addEventListener('click',function(){$('copyMsg').textContent='';renderCaps();build()});
          $('printT').addEventListener('click',function(){doPrint('t')});
          $('printP').addEventListener('click',function(){doPrint('p')});
          $('printG').addEventListener('click',function(){doPrint('g')});
          document.addEventListener('toggle',function(e){var el=e.target;if(!el.matches)return;if(el.matches('details[data-di]'))openPlan[el.dataset.di]=el.open;if(el.matches('details[data-nl]'))openNm[el.dataset.nl]=el.open},true);
          $('termSel').addEventListener('change',function(){switchTerm(this.value)});
          $('termName').addEventListener('change',function(){var c=S.terms.find(function(t){return t.id===S.curTerm});if(c&&this.value.trim()){c.name=this.value.trim();save();renderTerms()}});
          $('addTerm').addEventListener('click',addTerm);
          $('delTerm').addEventListener('click',delTerm);
          function importList(){
            var add=0,skip=0,newS=0;
            $('impList').value.split('\n').forEach(function(ln){
              ln=ln.trim();if(!ln)return;
              var p=ln.split(/\t|\||;|؛|،|,/).map(function(x){return x.trim()});
              if(p.length<2||!p[0]||!p[1]){skip++;return}
              var sid=resolveSubj(p[1]);
              if(!sid){var ns={id:uid(),name:p[1]};S.subjects.push(ns);sid=ns.id;newS++}
              var tok=(p[2]||'').replace(/\s/g,''),av='both';
              if(/^ص|صباح/.test(tok))av='am';else if(/^م|مساء/.test(tok))av='pm';
              S.teachers.push({id:uid(),name:p[0],sid:sid,av:av});add++;
            });
            $('impListMsg').textContent='تمت إضافة '+add+(newS?' - مواد جديدة: '+newS:'')+(skip?' - أسطر متجاهلة: '+skip:'');
            if(add){$('impList').value='';dirty();renderTeach();renderEx();renderPlan()}
          }
          $('impListBtn').addEventListener('click',importList);
          $('copyBtn').addEventListener('click',function(){
            if(!S.plan)return;var txt=planText(),m=$('copyMsg');
            function fb(){var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');m.textContent='تم النسخ'}catch(e){m.textContent='حدد النص و انسخه يدويا'}ta.remove()}
            if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){m.textContent='تم النسخ'},fb)}else fb();
          });

          $('school').value=S.school||'';$('year').value=S.year||'';
          renderAll();showTab();
          window.__hirasa_test=window.__hirasa_test||null;
          })();
          </script>

          </body>
          </html>
