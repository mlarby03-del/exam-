          function dutyHtml(t,di,pk,full){
            var d=S.days[di],P=S.plan,vals=[];
            for(var k=1;k<=d.n;k++)vals.push(P.asg[t.id][di+'-'+pk+'-'+k]||null);
            if(!vals.some(Boolean))return '';
            var pre=(pk==='am'?'ص':'م');
            if(vals.every(function(v){return v==='R'}))return full?'<div><b>احتياط</b></div>':pre+': احتياط';
            var out=[];
            vals.forEach(function(v,i){
              var k=i+1;if(!v)return;
              var tm=timeOf(di,pk,k),lead=d.n>1?'الحصة '+k+(tm?' ('+esc(tm)+')':'')+': ':(tm?esc(tm)+': ':'');
              if(v==='R'){out.push(full?'<div>'+lead+'<b>احتياط</b></div>':pre+k+': احتياط');return}
              var sh=v.slice(2),pr=sh.split('/'),lv=Number(pr[0]),n=Number(pr[1]),sj=exSubj(di,lv,k),rm=gRoom(lv,n);
              if(full)out.push('<div>'+lead+'<b>حراسة</b> - '+esc(gName(lv,n))+(rm?' - '+esc(rm):'')+(sj?' ('+esc(sj)+')':'')+'</div>');
              else out.push(pre+k+': حارس '+esc((S.gnames||{})[sh]||sh));
