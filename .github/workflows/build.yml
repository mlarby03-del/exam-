          }
          function renderTerms(){
            $('termSel').innerHTML=S.terms.map(function(t){return '<option value="'+t.id+'"'+(t.id===S.curTerm?' selected':'')+'>'+esc(t.name)+'</option>'}).join('');
            $('termName').value=termName();
            $('delTerm').disabled=S.terms.length<2;
          }
          function stash(){S.termData[S.curTerm]={days:S.days,pins:S.pins,plan:S.plan}}
          function switchTerm(id){
            if(id===S.curTerm)return;
            var x=S.termData[id];if(!x)return;
            stash();S.days=x.days;S.pins=x.pins||{};S.plan=x.plan||null;delete S.termData[id];S.curTerm=id;
            openDay=null;absMsg={};save();renderAll();
          }
          function addTerm(){
            var id=uid(),n=S.terms.length+1,nm2=['الأول','الثاني','الثالث','الرابع'];
            S.terms.push({id:id,name:'الفصل '+(nm2[n-1]||n)});
            var days=[];for(var i=0;i<5;i++)days.push(newDay());
            S.termData[id]={days:days,pins:{},plan:null};
            switchTerm(id);
          }
          function delTerm(){
            if(S.terms.length<2)return;
            var cur=S.curTerm,rest=S.terms.filter(function(t){return t.id!==cur}),to=rest[0].id,x=S.termData[to];
            S.terms=rest;S.curTerm=to;S.days=x.days;S.pins=x.pins||{};S.plan=x.plan||null;delete S.termData[to];
            openDay=null;absMsg={};save();renderAll();
          }
          function renderAll(){renderTeach();renderEx();renderGroups();renderDays();renderTerms();renderPlan();renderCaps()}

          /* ---------- plan ---------- */
          function gList(p){
            var out=[];p.lv.forEach(function(l){for(var i=1;i<=S.groups[l];i++)out.push({lv:l,n:i,short:l+'/'+i,label:gName(l,i),room:gRoom(l,i)})});return out;
          }
          function blocked(t,di,pk){var d=S.days[di];return !!(d&&(d.reqs||[]).some(function(q){return q.tid===t.id&&q.pk===pk&&q.role==='X'}))}
          function avail(p,di){return S.teachers.filter(function(t){return (t.av===p.k||t.av==='both')&&(di==null||(!isOff(t,di)&&!blocked(t,di,p.k)))})}
          function exSubj(di,lv,k){var d=S.days[di];return (d&&d.subs[lv]&&d.subs[lv][k-1])||''}
          function rMin(){return Math.min(S.reserve,Math.max(0,S.reserveMin==null?3:S.reserveMin))}
          function renderCaps(){
            var cap=Math.max(1,S.maxPer||6),nd=S.days.length,needTot=0;
            var h='<div class="caps">';
            PER.forEach(function(p){
              var g=gList(p).length;if(!g)return;
              var need=g+rMin(),have=avail(p).length,diff=have-need;needTot+=need*nd;
              h+='<div class="cap '+p.k+'"><span class="pill '+p.k+'">'+p.name+'</span>'+
                '<p class="big">'+have+' / '+need+'</p><p class="cnt">أساتذة متاحون / المطلوب في كل فترة</p>'+
                '<p>'+g+' حارس + '+rMin()+' إلى '+S.reserve+' احتياط</p>'+
                (diff>=0?'<span class="pill ok">كافٍ</span>':'<span class="pill bad">ينقص '+(-diff)+' أستاذ</span>')+'</div>';
            });
            var capTot=0;
            S.teachers.forEach(function(t){var u=0;PER.forEach(function(p){if(!gList(p).length||!(t.av===p.k||t.av==='both'))return;S.days.forEach(function(d,di){if(!isOff(t,di))u++})});capTot+=Math.min(cap,u)});
            h+='<div class="cap"><span class="pill">مجموع الفترات</span><p class="big">'+capTot+' / '+needTot+'</p><p class="cnt">المتاح (حد أقصى '+cap+' لكل أستاذ) / المطلوب</p>'+
              (capTot>=needTot?'<span class="pill ok">كافٍ</span>':'<span class="pill bad">ينقص '+(needTot-capTot)+' فترة</span>')+'</div>';
            $('capsBox').innerHTML=h+'</div>';
          }
          /* A "period" is one half-day (day + morning/afternoon). Each teacher works at most S.maxPer periods.
             Rules per period:
             - supervisors are NOT teachers of the subjects examined in that period;
             - reserves ARE teachers of the subjects examined that day, split between the subjects;
             - the minimum number of reserves is completed from other subjects only if the subject teachers are not enough (flagged);
             - the team is the same for every session of the period (it rotates between groups); there is ONE reserve list.
             Manual pins are applied first and kept as they are. */
          function pinKey(did,k,short){return did+'|'+k+'|'+short}
          function build(){
            var pins=S.pins||{},cap=Math.max(1,S.maxPer||6),R=Math.max(0,S.reserve),Rm=rMin();
            var sup={},res={},duty={},ssub={},cnt={},order={},asg={},byId={},dayDuty={};
            S.teachers.forEach(function(t,i){sup[t.id]=0;res[t.id]=0;duty[t.id]=0;order[t.id]=i;asg[t.id]={};byId[t.id]=t;dayDuty[t.id]={};cnt[t.sid]=(cnt[t.sid]||0)+1});
            S.subjects.forEach(function(x){ssub[x.id]=0});
            var kd={am:{},pm:{}};S.teachers.forEach(function(t){kd.am[t.id]=0;kd.pm[t.id]=0});
            function addDuty(id,di,pk){duty[id]++;dayDuty[id][di]=(dayDuty[id][di]||0)+1;if(pk)kd[pk][id]++}
            var ok={},pinUnit={};
            S.days.forEach(function(d,di){
              PER.forEach(function(p){
                var pool={};avail(p,di).forEach(function(t){pool[t.id]=1});
                for(var k=1;k<=d.n;k++){
                  var seen={};
                  gList(p).forEach(function(g){
                    var key=pinKey(d.id,k,g.short),tid=pins[key];
                    if(tid&&pool[tid]&&!seen[tid]){seen[tid]=1;ok[key]=tid;(pinUnit[di+'-'+p.k]=pinUnit[di+'-'+p.k]||{})[tid]=1}
                  });
                }
              });
            });
            Object.keys(pinUnit).forEach(function(uk){var di=Number(uk.split('-')[0]),pk0=uk.split('-')[1];Object.keys(pinUnit[uk]).forEach(function(id){addDuty(id,di,pk0)})});
            var ros={},units=[];
            S.days.forEach(function(d,di){PER.forEach(function(p){
              var gl=gList(p);if(!gl.length)return;
              var uk=di+'-'+p.k,pn=Object.keys(pinUnit[uk]||{});
              ros[uk]={team:pn.slice(),res:[],fb:false};
              (S.days[di].reqs||[]).forEach(function(q){
                var tt=byId[q.tid];if(!tt||q.role==='X'||q.pk!==p.k||isOff(tt,di)||blocked(tt,di,p.k)||ros[uk].team.indexOf(q.tid)>-1||ros[uk].res.indexOf(q.tid)>-1)return;
                if(q.role==='S'&&ros[uk].team.length<gl.length)ros[uk].team.push(q.tid);else ros[uk].res.push(q.tid);
                addDuty(q.tid,di,p.k);
              });
              units.push({uk:uk,di:di,p:p,g:gl.length,np:pn.length,E:examIds(di,p)});
            })});
            function inE(u,t){return u.E.indexOf(t.sid)>-1}
            function sortC(u,c){
              c.sort(function(a,b){
                function key(t){return duty[t.id]+kd[u.p.k][t.id]*1.5-(dayDuty[t.id][u.di]?0.5:0)+(t.av==='both'?0.75:0)}
                return key(a)-key(b)||order[a.id]-order[b.id];
              });
            }
            function taken(r,id){return r.team.indexOf(id)>-1||r.res.indexOf(id)>-1}
            function freePool(u){var r=ros[u.uk];return avail(u.p,u.di).filter(function(t){return !taken(r,t.id)&&duty[t.id]<cap})}
            function takeTeam(u){
              var r=ros[u.uk],need=Math.max(u.g,u.np)-r.team.length;if(need<=0)return;
              var all=freePool(u),pri=u.E.length?all.filter(function(t){return !inE(u,t)}):all;
              sortC(u,pri);
              var pick=pri.slice(0,need);
              if(pick.length<need&&u.E.length){
                var rest=all.filter(function(t){return inE(u,t)});sortC(u,rest);
                var more=rest.slice(0,need-pick.length);if(more.length)r.fb=true;pick=pick.concat(more);
              }
              pick.forEach(function(t){r.team.push(t.id);addDuty(t.id,u.di,u.p.k)});
            }
            function takeRes(u,target,fallback){
              var r=ros[u.uk],need=target-r.res.length;if(need<=0)return;
              var all=freePool(u),picked=[];
              if(u.E.length){
                var by={};u.E.forEach(function(id){by[id]=[]});
                all.forEach(function(t){if(by[t.sid])by[t.sid].push(t)});
                u.E.forEach(function(id){sortC(u,by[id])});
                var any=true,off=u.di%u.E.length;
                while(picked.length<need&&any){
                  any=false;
                  var cnt={};u.E.forEach(function(id){cnt[id]=0});
                  r.res.concat(picked.map(function(t){return t.id})).forEach(function(x){var sd=byId[x].sid;if(cnt[sd]!=null)cnt[sd]++});
                  var ord=u.E.map(function(id,i){return {id:id,i:(i-off+u.E.length)%u.E.length}}).filter(function(o){return by[o.id].length}).sort(function(a,b){return cnt[a.id]-cnt[b.id]||a.i-b.i});
                  if(ord.length){picked.push(by[ord[0].id].shift());any=true}
                }
                if(picked.length<need&&fallback){
                  var others=all.filter(function(t){return !inE(u,t)});sortC(u,others);
                  var more=others.slice(0,need-picked.length);if(more.length)r.fb=true;picked=picked.concat(more);
                }
              }else{
                sortC(u,all);picked=all.slice(0,need);
              }
              picked.forEach(function(t){r.res.push(t.id);addDuty(t.id,u.di,u.p.k)});
            }
            units.forEach(function(u){takeTeam(u);takeRes(u,Rm,true)});
            units.forEach(function(u){takeRes(u,R,false)});
            S.teachers.forEach(function(t){
              if(duty[t.id]>0)return;
              var best=null,bestE=null;
              units.forEach(function(u){
                if(!(t.av===u.p.k||t.av==='both')||isOff(t,u.di)||blocked(t,u.di,u.p.k))return;
                var size=ros[u.uk].team.length+ros[u.uk].res.length;
                if(inE(u,t)&&(!bestE||size<bestE.size))bestE={u:u,size:size};
                if(!best||size<best.size)best={u:u,size:size};
              });
              var pk=bestE||best;
              if(pk){ros[pk.u.uk].res.push(t.id);addDuty(t.id,pk.u.di,pk.u.p.k);if(!inE(pk.u,t))ros[pk.u.uk].fb=true}
            });
            var team={},resv={},fb={};
            units.forEach(function(u){
              var r=ros[u.uk],dn=S.days[u.di].n;
              team[u.uk]=r.team;resv[u.uk]=r.res.slice().sort(function(a,b){return order[a]-order[b]});fb[u.uk]=r.fb;
              r.team.forEach(function(id){sup[id]+=dn;ssub[byId[id].sid]+=dn});
              r.res.forEach(function(id){res[id]++});
            });
            var days=[];
            S.days.forEach(function(d,di){
              var dd={slots:[]};
              for(var k=1;k<=d.n;k++)dd.slots.push({k:k,periods:[]});
              PER.forEach(function(p){
                var gl=gList(p),uk=di+'-'+p.k,tm=team[uk]||[],rs=resv[uk]||[],prevG={};
                for(var k=1;k<=d.n;k++){
                  var gs=[],freeG=[],pinnedNow={},asgNow={};
                  gl.forEach(function(g){var pt=ok[pinKey(d.id,k,g.short)];if(pt){pinnedNow[pt]=1;asgNow[g.short]=pt}else freeG.push(g)});
                  var freeT=tm.filter(function(id){return !pinnedNow[id]});
                  freeT.sort(function(a,b){return order[a]-order[b]});
                  var taken2={};
                  if(k>1){freeG.forEach(function(g){var c=prevG[g.short];if(c&&freeT.indexOf(c)>-1&&!taken2[c]){asgNow[g.short]=c;taken2[c]=1}})}
                  var restT=freeT.filter(function(id){return !taken2[id]});
                  freeG.forEach(function(g){
                    if(asgNow[g.short])return;
                    var id=restT.shift();if(id)asgNow[g.short]=id;
                  });
                  var usedNow={};
                  gl.forEach(function(g){
                    var id=asgNow[g.short]||null;
                    if(id){usedNow[id]=1;asg[id][di+'-'+p.k+'-'+k]='S:'+g.short;prevG[g.short]=id}
                    gs.push({label:g.label,short:g.short,lv:g.lv,tid:id});
                  });
                  tm.forEach(function(id){if(!usedNow[id])asg[id][di+'-'+p.k+'-'+k]='R'});
                  rs.forEach(function(id){asg[id][di+'-'+p.k+'-'+k]='R'});
                  dd.slots[k-1].periods.push({k:p.k,name:p.name,groups:gs,reserves:gl.length?rs.slice():[],fb:!!fb[uk]});
                }
              });
              days.push(dd);
            });
            S.plan={days:days,sup:sup,res:res,duty:duty,asg:asg};save();renderPlan();
          }
          function nm(id){var t=T(id);return t?t.name:'—'}
          function dayMiss(dd){
            var m=0;
            dd.slots.forEach(function(sl,i){sl.periods.forEach(function(pp){
              m+=pp.groups.filter(function(g){return !g.tid}).length;
              if(i===0&&pp.groups.length)m+=Math.max(0,rMin()-pp.reserves.length);
            })});
            return m;
          }
          var openPlan={0:true};
          function onDutyList(di){
            var P=S.plan;if(!P)return [];
            return S.teachers.filter(function(t){return Object.keys(P.asg[t.id]||{}).some(function(k){return k.indexOf(di+'-')===0})});
          }
          function renderPlan(){
            var P=S.plan;$('copyBtn').disabled=!P;
            var h='';
            S.days.forEach(function(d,di){
              var dd=P&&P.days[di],miss=dd?dayMiss(dd):0;
              h+='<details class="card" data-di="'+di+'"'+(openPlan[di]?' open':'')+'><summary><span>'+esc(dayTitle(di))+'</span>'+(dd?(miss?'<span class="pill bad">ينقص '+miss+'</span>':'<span class="pill ok">مكتمل</span>'):'')+'</summary>';
              if(dd){
                h+='<div class="row" style="margin:10px 0 4px"><select id="ab-'+di+'" style="width:auto;min-width:180px" aria-label="الأستاذ الغائب"><option value="">أستاذ غائب في هذا اليوم</option>'+
                  onDutyList(di).map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'</option>'}).join('')+'</select><button type="button" data-act="absent" data-di="'+di+'">استبدال</button></div>'+
                  (absMsg[di]?'<div class="okmsg" style="margin:6px 0">'+esc(absMsg[di])+'</div>':'');
              }
              PER.forEach(function(p){
                var gl=gList(p);if(!gl.length)return;
                var pool=avail(p,di);
                h+='<div class="sbhead" style="margin-top:12px"><span class="pill '+p.k+'">'+p.name+'</span></div>';
                h+='<div class="tw"><table><thead><tr><th>الفوج</th>';
                for(var k=1;k<=d.n;k++){var tm=timeOf(di,p.k,k);h+='<th>'+(d.n>1?'الحصة '+k:'الأستاذ الحارس')+(tm?'<br><small>'+esc(tm)+'</small>':'')+'</th>'}
                h+='</tr></thead><tbody>';
                gl.forEach(function(g){
                  h+='<tr><td>'+esc(g.label)+(g.room?'<br><small class="cnt">'+esc(g.room)+'</small>':'')+'</td>';
                  for(var k2=1;k2<=d.n;k2++){
                    var key=pinKey(d.id,k2,g.short),pin=(S.pins||{})[key]||'';
                    var pp=dd&&dd.slots[k2-1].periods.find(function(q){return q.k===p.k});
                    var as=pp&&pp.groups.find(function(q){return q.short===g.short}),aid=as?as.tid:null;
                    var bad=pp&&pin&&aid!==pin;
                    h+='<td><div class="cnt">'+esc(exSubj(di,g.lv,k2)||'—')+'</div>'+
                      '<select class="'+(bad?'bad':'')+'" id="pn-'+di+'-'+k2+'-'+g.lv+'-'+g.n+'" data-act="pin" data-d="'+d.id+'" data-k="'+k2+'" data-s="'+g.short+'" aria-label="حارس '+esc(g.label)+' الحصة '+k2+'">'+
                      '<option value="">'+(aid&&!pin?'تلقائي: '+esc(nm(aid)):'تلقائي')+'</option>'+
                      pool.map(function(t){return '<option value="'+t.id+'"'+(pin===t.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></td>';
                  }
                  h+='</tr>';
                });
                h+='</tbody></table></div>';
                var pp1=dd&&dd.slots[0].periods.find(function(q){return q.k===p.k});
                if(pp1){
                  h+='<b>الأساتذة الاحتياط ('+pp1.reserves.length+')</b>'+(pp1.fb?' <span class="pill am">من مواد أخرى</span>':'')+
                    '<div class="chips" style="margin:6px 0 12px">'+pp1.reserves.map(function(id,i){var t=T(id);return '<span class="chip">'+(i+1)+'. '+esc(nm(id))+(t?' <small>'+esc(subjName(t.sid))+'</small>':'')+'</span>'}).join('')+'</div>';
                }
              });
              h+='</details>';
            });
            if(P){
              h+='<div class="card"><h2>عدد المهام لكل أستاذ</h2><div class="tw"><table><thead><tr><th>الأستاذ</th><th>المادة</th><th>الفترات</th><th>حصص الحراسة</th><th>فترات الاحتياط</th></tr></thead><tbody>';
              S.teachers.forEach(function(t){h+='<tr><td>'+esc(t.name)+'</td><td>'+esc(subjName(t.sid))+'</td><td>'+(P.duty[t.id]||0)+'</td><td>'+(P.sup[t.id]||0)+'</td><td>'+(P.res[t.id]||0)+'</td></tr>'});
              h+='</tbody></table></div></div>';
            }
            $('planBox').innerHTML=h;
          }
          /* An absent teacher on an exam day is replaced by one of that period's reserves; the reserve list is refilled when possible. */
          function replaceAbsent(di,tid){
            var P=S.plan,d=S.days[di],tt=T(tid);if(!P||!tt)return '';
            var info=[],capN=Math.max(1,S.maxPer||6);
            PER.forEach(function(p){
              var pps=P.days[di].slots.map(function(sl){return sl.periods.find(function(q){return q.k===p.k})});
              if(!pps[0]||!pps[0].groups.length)return;
              var supSlots=[];
              pps.forEach(function(q,i){if(q.groups.some(function(g){return g.tid===tid}))supSlots.push(i)});
              var wasRes=pps[0].reserves.indexOf(tid)>-1;
              if(!supSlots.length&&!wasRes)return;
              var before=pps[0].reserves.length,repl=null,pre=di+'-'+p.k+'-';
              if(supSlots.length){
                var rl=pps[0].reserves.filter(function(id){return id!==tid});
                rl.sort(function(a,b){return (P.sup[a]||0)-(P.sup[b]||0)});
                repl=rl[0]||null;
              }
              pps.forEach(function(q,i){
                q.groups.forEach(function(g){if(g.tid===tid){g.tid=repl;if(repl)P.asg[repl][pre+(i+1)]='S:'+g.short}});
                q.reserves=q.reserves.filter(function(id){return id!==tid&&id!==repl});
              });
              Object.keys(P.asg[tid]).forEach(function(k){if(k.indexOf(pre)===0)delete P.asg[tid][k]});
              P.duty[tid]=Math.max(0,P.duty[tid]-1);
              if(supSlots.length){P.sup[tid]-=supSlots.length;if(repl){P.sup[repl]+=supSlots.length;P.res[repl]=Math.max(0,P.res[repl]-1)}}
              else P.res[tid]=Math.max(0,P.res[tid]-1);
              var E=examIds(di,p),onDuty={};onDuty[tid]=1;
              pps.forEach(function(q){q.groups.forEach(function(g){if(g.tid)onDuty[g.tid]=1});q.reserves.forEach(function(id){onDuty[id]=1})});
              while(pps[0].reserves.length<before){
                var c=avail(p,di).filter(function(x){return !onDuty[x.id]&&P.duty[x.id]<capN&&(!E.length||E.indexOf(x.sid)>-1)});
                c.sort(function(a,b){return P.duty[a.id]-P.duty[b.id]});
                if(!c.length)break;
                var x=c[0];
                pps.forEach(function(q,i){q.reserves.push(x.id);P.asg[x.id][pre+(i+1)]='R'});
                P.duty[x.id]++;P.res[x.id]++;onDuty[x.id]=1;
              }
              info.push((p.k==='am'?'صباحا':'مساءا')+(supSlots.length?(repl?': '+nm(repl)+' يعوّض '+tt.name:': لا يوجد احتياط لتعويضه'):': أُزيل من الاحتياط'));
            });
            var msg=info.length?info.join(' | '):'هذا الأستاذ ليس مكلفا في هذا اليوم.';
            if(info.length){
              tt.off=tt.off||[];if(tt.off.indexOf(d.id)<0)tt.off.push(d.id);
              Object.keys(S.pins||{}).forEach(function(k){if(k.indexOf(d.id+'|')===0&&S.pins[k]===tid)delete S.pins[k]});
            }
            absMsg[di]=msg;save();renderPlan();
            return msg;
          }
