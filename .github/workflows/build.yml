          function u32(b,o){return (b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0}
          function xmlDec(t){return String(t).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,function(m,n){return String.fromCharCode(Number(n))}).replace(/&amp;/g,'&')}
          function zipEntries(buf){
            var b=new Uint8Array(buf),e=b.length-22;while(e>=0&&u32(b,e)!==0x06054b50)e--;
            if(e<0)throw new Error('ملف غير صالح');
