          var CALP='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1f4b8e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>';
          function sheetPersonal(tid){
