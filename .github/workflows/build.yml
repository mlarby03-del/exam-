name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hirasa-debug-keystore
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create files and build the app
        run: |
          mkdir -p www
          cat > www/index.html <<'HIRASA_HTML_END'
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>حراسة الاختبارات</title>
          <style>
          /* Layout: sticky tab bar, three panels (teachers, groups, plan) + hidden print sheet. Morning = amber, afternoon = indigo. */
          :root{
            --bg:#f3f5f8; --surface:#ffffff; --fg:#17202e; --muted:#5b6678; --line:#dde2ea;
            --accent:#1d4f8c; --accent-fg:#ffffff;
            --am:#b86e00; --am-bg:#fdf1dc; --pm:#4a3fa8; --pm-bg:#e9e6fb;
            --ok:#17794a; --ok-bg:#dff3e8; --bad:#b3261e; --bad-bg:#fde6e4;
            --f-display:'Cairo','Tajawal',system-ui,sans-serif; --f-body:'Tajawal',system-ui,sans-serif;
          }
          @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
            --bg:#0f1520; --surface:#18202e; --fg:#e8edf5; --muted:#9aa6ba; --line:#2a3447;
            --accent:#6aa5ee; --accent-fg:#0b1220;
            --am:#f0b04a; --am-bg:#3a2b10; --pm:#b3a9ff; --pm-bg:#27244d;
            --ok:#5fd09a; --ok-bg:#12372a; --bad:#ff8f87; --bad-bg:#43191a; color-scheme:dark}}
          :root[data-theme="dark"]{
            --bg:#0f1520; --surface:#18202e; --fg:#e8edf5; --muted:#9aa6ba; --line:#2a3447;
            --accent:#6aa5ee; --accent-fg:#0b1220;
            --am:#f0b04a; --am-bg:#3a2b10; --pm:#b3a9ff; --pm-bg:#27244d;
            --ok:#5fd09a; --ok-bg:#12372a; --bad:#ff8f87; --bad-bg:#43191a; color-scheme:dark}
          *{box-sizing:border-box}
          body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;
            padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
          .wrap{max-width:860px;margin-inline:auto}
          header{padding-block:18px 8px}
          h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;text-wrap:balance}
          h2{font-family:var(--f-display);font-weight:800;font-size:1.15rem;margin:0 0 10px}
          .sub{color:var(--muted);margin:2px 0 0;font-size:.95rem}
          body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
          nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:8px;display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
          nav a{flex:1;text-align:center;padding:10px 4px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.95rem;border:1px solid transparent}
          nav a.on{background:var(--accent);color:var(--accent-fg)}
          nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
          section.panel{display:none}section.panel.on{display:block}
          .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
          .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
          .row>*{min-width:0}
          label.f{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
          input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
          textarea{min-height:90px;resize:vertical}
          .grow{flex:1 1 200px}
          button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px}
          button.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
          button.del{color:var(--bad);padding:6px 10px}
          button:disabled{opacity:.45;cursor:not-allowed}
          button.icon{width:42px;height:42px;padding:0;border-radius:50%;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);display:grid;place-items:center;flex:none}
          .seg{display:flex;gap:6px;flex-wrap:wrap}
          .seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--bg)}
          .seg input{accent-color:var(--accent)}
          .note{background:var(--am-bg);color:var(--fg);border:1px solid var(--am);border-radius:10px;padding:12px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
          .sbhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
          .sbhead b{font-family:var(--f-display)}
          .cnt{color:var(--muted);font-size:.85rem}
          .addbox{background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:12px;margin-bottom:10px}
          .trow{display:grid;grid-template-columns:1fr 110px auto auto;gap:8px;margin-bottom:6px;align-items:center}
          .trow select{padding:8px 6px}
          .empty{color:var(--muted);font-size:.9rem;padding:4px 0}
          .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
          .pill.am{background:var(--am-bg);color:var(--am)}.pill.pm{background:var(--pm-bg);color:var(--pm)}
          .pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
          .glvl{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
          .glvl:last-child{border:0}
          .step{display:flex;align-items:center;gap:6px}
          .step button{width:40px;height:40px;padding:0;font-size:1.3rem;line-height:1}
          .step input{width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
          .caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
          .cap{border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--surface);border-inline-start:6px solid var(--line)}
          .cap.am{border-inline-start-color:var(--am)}.cap.pm{border-inline-start-color:var(--pm)}
          .cap .big{font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
          .cap p{margin:2px 0}
          .tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
          table{border-collapse:collapse;width:100%;min-width:420px;background:var(--surface)}
          th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);font-size:.95rem}
          th{background:var(--bg);font-size:.85rem;color:var(--muted)}
          tr:last-child td{border-bottom:0}
          td.miss{color:var(--bad);font-weight:700}
          .chips{display:flex;flex-wrap:wrap;gap:6px}
          .chip{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.92rem}
          .chip small{color:var(--muted)}
          .hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
          #printSheet{display:none}
          button.ib2{padding:6px 10px;font-size:.85rem}
          input.bad{border-color:var(--bad)}
          details.nm>summary{cursor:pointer;font-weight:700;padding:8px 0}
          details.nm input{min-width:110px}
          td select{min-width:150px;padding:6px}
          select.bad{border-color:var(--bad);color:var(--bad)}
          button.ib{display:inline-flex;align-items:center;gap:8px;border-color:var(--accent);color:var(--accent)}
          .okmsg{background:var(--ok-bg);color:var(--ok);border-radius:8px;padding:8px 12px;font-weight:700}
          details.card>summary{cursor:pointer;font-family:var(--f-display);font-weight:800;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
          details.card>summary::-webkit-details-marker{display:none}
          details.card>summary::after{content:"+";font-size:1.3rem;color:var(--accent)}
          details.card[open]>summary::after{content:"−"}
          details.card h3{font-size:1rem;margin:14px 0 6px}
          .lvrow{display:grid;grid-template-columns:130px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
          .lvrow .lbl{display:flex;flex-direction:column;gap:2px;font-weight:700}
          .lvrow input{padding:8px}
          @media (max-width:480px){.trow{grid-template-columns:1fr 96px auto auto}.lvrow{grid-template-columns:1fr 1fr}.lvrow .lbl{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}.trow{grid-template-columns:1fr 100px auto}.glvl{grid-template-columns:1fr auto}.glvl .pill{grid-column:1}}
          @media print{
            .wrap,body::before{display:none!important}
            body{background:#fff!important;color:#000!important;padding:0!important}
            #printSheet{display:block!important;direction:rtl;color:#000;font-family:'Tajawal',Tahoma,Arial,sans-serif;font-size:12pt}
            #printSheet .ph p{margin:0;text-align:center;font-weight:700;font-size:13pt}
            #printSheet .ph2{display:flex;justify-content:space-between;margin:14px 0 6px;font-weight:700}
            #printSheet .pt{text-align:center;font-size:15pt;margin:14px 0 10px;text-decoration:underline}
            #printSheet h4{margin:14px 0 6px;font-size:12.5pt}
            #printSheet table{min-width:0;width:100%;border-collapse:collapse;background:#fff}
            #printSheet th,#printSheet td{border:1px solid #000;padding:4px 6px;font-size:11pt;color:#000;text-align:center}
            #printSheet th{background:#e6e6e6}
            #printSheet td.l{text-align:start}
            #printSheet tr{break-inside:avoid}
            #printSheet .pg{break-after:page}
            #printSheet .pg:last-child{break-after:auto}
            #printSheet table.tt th,#printSheet table.tt td{font-size:9pt;padding:3px 4px}
            #printSheet small{font-weight:400}
            #printSheet p.leg{font-size:9.5pt;margin:8px 0 0}
            #printSheet ol.rl{columns:3;margin:4px 0 10px;padding-inline-start:22px;font-size:11pt}
            #printSheet ol.rl li{break-inside:avoid}
            #printSheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
            #printSheet .tpt{width:62%;margin:22px auto 14px;border:2px solid #1f4b8e;border-radius:40px;padding:10px 24px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:20pt;font-weight:800;color:#000}
            #printSheet .tpn{text-align:center;font-weight:700;font-size:13pt;margin:6px 0 16px}
            #printSheet .tpn small{font-weight:400;font-size:11pt}
            #printSheet table.tpl{border-collapse:separate;border-spacing:0;border:2px solid #1f4b8e;border-radius:12px;overflow:hidden}
            #printSheet table.tpl th{background:#1f4b8e;color:#fff;font-size:13pt;padding:10px;border:0;border-inline-start:1px solid #fff}
            #printSheet table.tpl td{border:0;border-top:1.5px solid #1f4b8e;border-inline-start:1.5px solid #1f4b8e;height:25mm;padding:6px 8px;font-size:11pt;text-align:center;vertical-align:middle;background:#fff}
            #printSheet table.tpl td.dy{font-weight:800;font-size:12.5pt;width:24%}
            #printSheet .sigs{display:flex;justify-content:space-between;margin-top:40px;font-weight:700;color:#1f4b8e;padding-inline:20px}
            #printSheet .sig{margin-top:28px;display:flex;justify-content:flex-end;padding-inline-end:30px;font-weight:700}
            #printSheet p.res{margin:6px 0;font-size:11pt}
          }
          @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
          </style>

          </head>
          <body>
          <div class="wrap" dir="rtl" lang="ar">
          <header>
            <h1>حراسة الاختبارات</h1>
            <p class="sub">أدخل الأساتذة و الأفواج و أيام الاختبارات، و التطبيق يوزّع الحراسة بالتساوي.</p>
            <div class="row" style="margin-top:10px">
              <button type="button" class="ib" id="expBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>حفظ المعلومات</button>
              <button type="button" class="ib" id="impBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V5M7 9l5-5 5 5M5 20h14"/></svg>استيراد المعلومات</button>
              <input type="file" id="impFile" hidden>
            </div>
            <div id="bkMsg" aria-live="polite" style="margin-top:8px"></div>
          </header>
          <nav>
            <a href="#teachers" data-tab="teachers">الأساتذة</a>
            <a href="#groups" data-tab="groups">الأفواج</a>
            <a href="#days" data-tab="days">الأيام</a>
            <a href="#plan" data-tab="plan">التوزيع</a>
          </nav>

          <section class="panel" id="teachers">
            <div id="exNote"></div>
            <div class="card">
              <h2>مادة جديدة</h2>
              <div class="row"><div class="grow"><label class="f" for="newSubj">اسم المادة</label><input type="text" id="newSubj" placeholder="مثال: الأمازيغية"></div>
              <button type="button" id="addSubjBtn" style="align-self:flex-end">إضافة المادة</button></div>
              <p class="hint">لإضافة أساتذة اضغط على أيقونة + في بطاقة المادة.</p>
            </div>
            <details class="card"><summary>استيراد قائمة أساتذة</summary>
              <p class="hint">كل سطر: الاسم ، المادة ، الفترة (صباحا / مساءا / كاملا). الفترة اختيارية، و يمكن اللصق من Excel.</p>
              <textarea id="impList" placeholder="بن عمر محمد | الرياضيات | صباحا&#10;سعيدي فاطمة | اللغة العربية"></textarea>
              <div class="row" style="margin-top:8px"><button class="pri" type="button" id="impListBtn">استيراد القائمة</button><span class="cnt" id="impListMsg" aria-live="polite"></span></div>
            </details>
            <div id="teachList"></div>
          </section>

          <section class="panel" id="groups">
            <div class="card">
              <h2>عدد الأفواج في كل مستوى</h2>
              <div id="groupsBox"></div>
              <p class="hint">اختر لكل مستوى الفترة التي يجتاز فيها الاختبارات. كل فوج يحتاج أستاذا حارسا، و باقي الأساتذة المتاحين في الفترة يكونون احتياطا.</p>
            </div>
            <div class="card">
              <h2>الأساتذة الاحتياط</h2>
              <div class="glvl" style="grid-template-columns:1fr auto">
                <span>العدد المفضل في كل فترة</span>
                <div class="step"><button type="button" data-act="rdec" aria-label="إنقاص">−</button><input type="number" id="resN" min="0" inputmode="numeric"><button type="button" data-act="rinc" aria-label="زيادة">+</button></div>
              </div>
              <div class="glvl" style="grid-template-columns:1fr auto">
                <span>الحد الأدنى إذا نقص الأساتذة</span>
                <div class="step"><button type="button" data-act="mrdec" aria-label="إنقاص">−</button><input type="number" id="minResN" min="0" inputmode="numeric"><button type="button" data-act="mrinc" aria-label="زيادة">+</button></div>
              </div>
            </div>
            <div class="card">
              <h2>الحد الأقصى لفترات كل أستاذ</h2>
              <div class="glvl" style="grid-template-columns:1fr auto">
                <span>الفترة = صباح أو مساء من يوم واحد</span>
                <div class="step"><button type="button" data-act="mdec" aria-label="إنقاص">−</button><input type="number" id="maxN" min="1" inputmode="numeric"><button type="button" data-act="minc" aria-label="زيادة">+</button></div>
              </div>
            </div>
            <div class="card"><h2>أسماء الأفواج و القاعات</h2>
              <div id="namesBox"></div>
              <p class="hint">اختياري. الاسم و القاعة يظهران في الجداول المطبوعة.</p>
            </div>
          </section>

          <section class="panel" id="days">
            <div class="card"><h2>الاختبارات</h2>
              <div class="row"><div class="grow"><label class="f" for="termSel">الفصل</label><select id="termSel"></select></div>
              <div class="grow"><label class="f" for="termName">اسم الفصل</label><input type="text" id="termName"></div></div>
              <div class="row" style="margin-top:10px"><button type="button" id="addTerm">إضافة فصل</button><button class="del" type="button" id="delTerm">حذف هذا الفصل</button></div>
              <p class="hint" style="margin:8px 0 0">لكل فصل أيامه و توزيعه، و الأساتذة و الأفواج مشتركة.</p>
            </div>
            <div class="card"><h2>أيام الاختبارات</h2>
              <p class="hint" style="margin:0 0 10px">اضغط على أيقونة التقويم في كل يوم لتحديد عدد المواد و مادة كل مستوى. كل فوج يجتاز مواد اليوم في فترته (صباحا أو مساءا).</p>
              <div class="row"><button type="button" id="addDay">إضافة يوم</button><button class="del" type="button" id="delDay">حذف آخر يوم</button></div>
            </div>
            <div id="daysList"></div>
            <datalist id="sjl"></datalist>
          </section>

          <section class="panel" id="plan">
            <div class="card">
              <h2>ترويسة الطباعة</h2>
              <div class="row">
                <div class="grow"><label class="f" for="school">اسم المتوسطة</label><input type="text" id="school"></div>
                <div class="grow"><label class="f" for="year">السنة الدراسية</label><input type="text" id="year"></div>
              </div>
            </div>
            <div id="capsBox"></div>
            <div class="row" style="margin-bottom:14px">
              <button class="pri" type="button" id="buildBtn">إنجاز الجدول</button>
              <button type="button" id="copyBtn" disabled>نسخ كنص</button>
              <span class="cnt" id="copyMsg" aria-live="polite"></span>
            </div>
            <div class="card">
              <h2>الطباعة</h2>
              <div class="row">
                <div class="grow"><label class="f" for="pDay">اليوم</label><select id="pDay"></select></div>
                <div class="grow"><label class="f" for="pPer">الفترة</label><select id="pPer"><option value="all">الفترتان</option><option value="am">صباحا</option><option value="pm">مساءا</option></select></div>
              </div>
              <div class="row" style="margin-top:10px"><div class="grow"><label class="f" for="pTch">الأستاذ</label><select id="pTch"></select></div></div>
              <div class="row" style="margin-top:10px"><button class="pri" type="button" id="printG">طباعة جدول الحراسة</button><button class="pri" type="button" id="printP">طباعة جدول الأستاذ</button><button type="button" id="printT">الجدول الإجمالي للأساتذة</button></div>
            </div>
            <div id="planBox"></div>
          </section>
          </div>
          <div id="printSheet" dir="rtl" lang="ar"></div>
          <style id="pgs"></style>

          <script>
          (function(){
          var KEY='hirasa-v3';
          var LV={1:'السنة الأولى',2:'السنة الثانية',3:'السنة الثالثة',4:'السنة الرابعة'};
          var PER=[{k:'am',name:'الفترة الصباحية',lv:[]},{k:'pm',name:'الفترة المسائية',lv:[]}];
          function syncPer(){PER.forEach(function(p){p.lv=[1,2,3,4].filter(function(l){return S.lvPer[l]===p.k})})}
          var AVL={am:'صباحا',pm:'مساءا',both:'اليوم كاملا'};
          var SUBJ=['اللغة العربية','الرياضيات','اللغة الفرنسية','اللغة الإنجليزية','العلوم الطبيعية','العلوم الفيزيائية','التاريخ و الجغرافيا و التربية المدنية','التربية الإسلامية','التربية التشكيلية','التربية الموسيقية','التربية البدنية','الإعلام الآلي'];
          var EXTRA=['التاريخ و الجغرافيا','التربية المدنية','الأمازيغية'];
          var EXN=[4,4,3,3,3,2,3,2,1,1,3,1], EXA=['both','am','pm','both'];
          var uid=function(){return Math.random().toString(36).slice(2,9)};
          var S, openAdd=null, openDay=null, openOff=null, pending=null, absMsg={};

          function newDay(){return {id:uid(),date:'',n:2,subs:{1:['',''],2:['',''],3:['',''],4:['','']},t:{am:['',''],pm:['','']},reqs:[]}}
          function fixState(o){
            o.pins=o.pins||{};o.maxPer=o.maxPer||6;if(o.reserveMin==null)o.reserveMin=3;
            o.lvPer=o.lvPer||{1:'pm',2:'am',3:'pm',4:'am'};o.gnames=o.gnames||{};o.rooms=o.rooms||{};
            if(!o.terms||!o.terms.length){o.terms=[{id:'t1',name:'الفصل الأول'}];o.curTerm='t1'}
            o.termData=o.termData||{};
            var fx=function(d){d.t=d.t||{am:['',''],pm:['','']};d.reqs=d.reqs||[]};
            o.days.forEach(fx);
