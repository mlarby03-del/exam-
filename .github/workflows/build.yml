          cat > mkicons.js <<'HIRASA_JS_END'
          const sharp = require('sharp');
          const fs = require('fs');
          const sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };
          const svg = fs.readFileSync('icon.png');
          (async () => {
            for (const [d, s] of Object.entries(sizes)) {
              const dir = 'android/app/src/main/res/mipmap-' + d;
              const sq = await sharp(svg).resize(s, s).png().toBuffer();
              const round = sq;
              fs.writeFileSync(dir + '/ic_launcher.png', sq);
              fs.writeFileSync(dir + '/ic_launcher_foreground.png', sq);
              fs.writeFileSync(dir + '/ic_launcher_round.png', round);
            }
          })();
          HIRASA_JS_END
          cat > MainActivity.java <<'HIRASA_JAVA_END'
          package com.hirasa.app;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private class PrintBridge {
                  @JavascriptInterface
                  public void print(final boolean landscape) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              WebView wv = getBridge().getWebView();
                              PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                              PrintDocumentAdapter adapter = wv.createPrintDocumentAdapter("hirasa");
                              PrintAttributes.MediaSize size = landscape ? PrintAttributes.MediaSize.ISO_A4.asLandscape() : PrintAttributes.MediaSize.ISO_A4;
                              pm.print("hirasa", adapter, new PrintAttributes.Builder().setMediaSize(size).build());
                          }
                      });
                  }
              }

              private class BackupBridge {
                  @JavascriptInterface
                  public String saveFile(String name, String content) {
                      try {
                          return store(name, content.getBytes("UTF-8"), name.endsWith(".csv") ? "text/csv" : "application/json");
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String saveB64(String name, String b64, String mime) {
                      try {
                          return store(name, android.util.Base64.decode(b64, android.util.Base64.DEFAULT), mime);
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }

                  private String store(String name, byte[] data, String mime) {
                      try {
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                              v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                              v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOCUMENTS + "/exam");
                              Uri u = getContentResolver().insert(MediaStore.Files.getContentUri("external"), v);
                              OutputStream o = getContentResolver().openOutputStream(u);
                              o.write(data);
                              o.close();
                              return "documents";
                          } else {
                              File dir = new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS), "exam");
                              dir.mkdirs();
                              FileOutputStream o = new FileOutputStream(new File(dir, name));
                              o.write(data);
                              o.close();
                              return "documents";
                          }
                      } catch (Exception e) {
                          return "error: " + e.getMessage();
                      }
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new PrintBridge(), "AndroidPrint");
                  getBridge().getWebView().addJavascriptInterface(new BackupBridge(), "AndroidBackup");
              }
          }
          HIRASA_JAVA_END
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 sharp
          npx cap init "حراسة الاختبارات" com.hirasa.app --web-dir www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          node mkicons.js
          cp MainActivity.java android/app/src/main/java/com/hirasa/app/MainActivity.java
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hirasa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
